name: Sync Fork from Upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        run: |
          git config user.name "sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/2222221029/AudioFlow.git || true
          git fetch upstream --tags --force --quiet

          UPSTREAM=$(git rev-parse upstream/main)

          # 上游 HEAD 已包含在 main 历史中 = 上游无新提交
          if git merge-base --is-ancestor "$UPSTREAM" main; then
            echo "✅ 已是最新，无需同步"
            echo "synced=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          VER_BEFORE=$(cat VERSION 2>/dev/null || echo "")
          BEFORE_REBASE=$(git rev-parse main)

          # -X theirs：冲突时保留我们的改动（workflow/README/compose 定制），上游其余改动照常合入
          git rebase -X theirs upstream/main

          # 恢复我们自己的 CI workflows（上游 workflow 不适合 fork，且无 workflows 权限直接推会被拒）
          # 整目录删除清掉上游 workflow，再按【显式白名单】恢复自有文件。
          # 不用 "git checkout $BEFORE_REBASE -- .github/workflows/"：那是以上次状态为准，
          # 一旦历史里混入过上游 workflow 就会被永久继承。白名单以仓库自身为准，与历史无关。
          rm -rf .github/workflows
          mkdir -p .github/workflows
          KEEP="docker-image.yml sync-upstream.yml"
          for f in $KEEP; do
            if git cat-file -e "$BEFORE_REBASE:.github/workflows/$f" 2>/dev/null; then
              git show "$BEFORE_REBASE:.github/workflows/$f" > ".github/workflows/$f"
            else
              echo "⚠️ 白名单文件在上次提交中缺失: $f"
            fi
          done
          # 安全闸：自有 workflow 必须齐全，否则宁可中止也不推（避免把 fork 的 CI 搞没）
          MISSING=""
          for f in $KEEP; do
            [ -s ".github/workflows/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "❌ 自有 workflow 缺失:$MISSING —— 中止同步，main 分支未改动"
            git rebase --abort || true
            exit 1
          fi
          # 意外混入的非白名单文件直接清掉（双保险）
          find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) \
            ! -name 'docker-image.yml' ! -name 'sync-upstream.yml' -delete
          git add -A .github/workflows/
          git diff --cached --quiet || git commit -m "chore: keep our CI workflows"

          git push origin main --force-with-lease

          VER_AFTER=$(cat VERSION 2>/dev/null || echo "")
          if [ "$VER_BEFORE" != "$VER_AFTER" ]; then
            echo "version_changed=true" >> $GITHUB_OUTPUT
          else
            echo "version_changed=false" >> $GITHUB_OUTPUT
          fi
          echo "🎉 已同步上游更新 (VERSION: ${VER_BEFORE:-无} -> ${VER_AFTER:-无})"
          echo "synced=true" >> $GITHUB_OUTPUT
          # 自动构建已停用（GitHub 账户额度超额）。版本变化时同步只更新代码，不再触发 Docker 构建。
