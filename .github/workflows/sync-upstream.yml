name: Sync Fork from Upstream

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync upstream
        id: sync
        run: |
          git config user.name "sync-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/2222221029/AudioFlow.git || true
          git fetch upstream --tags --force --quiet

          UPSTREAM=$(git rev-parse upstream/main)

          # 上游 HEAD 已包含在 main 历史中 = 上游无新提交
          if git merge-base --is-ancestor "$UPSTREAM" main; then
            echo "✅ 已是最新，无需同步"
            echo "synced=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          git rebase upstream/main
          git push origin main --force-with-lease
          echo "🎉 已同步上游更新"
          echo "synced=true" >> $GITHUB_OUTPUT

      # 有更新时才触发 Docker 构建
      - name: 触发 Docker 构建
        if: steps.sync.outputs.synced == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docker-image.yml --ref main --repo workroom2008/AudioFlow
